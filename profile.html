<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АртПин – Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="container header__row">
        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="Логотип" style="width: 32px; height: 32px; object-fit: contain;">
            <div class="brand__text">
                <span class="brand__name">АртПин</span>
            </div>
        </a>

        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="collections.html">Подборки</a>
            <a href="profile.html" class="active">Профиль</a>
        </nav>

        <button class="theme-btn" id="themeBtn">🌙 Тема</button>
    </div>
</header>

<main>
    <div class="container">

        <div class="hero">
            <h1>Профиль дизайнера</h1>
            <p class="hero__desc">Ваши работы и информация</p>
        </div>

<div class="form-card">

    <div class="form-group">
        <label>Имя</label>
        <input type="text" id="profileName" placeholder="Ваше имя">
    </div>

    <div class="form-group">
        <label>Описание</label>
        <textarea rows="4" id="profileAbout" placeholder="Расскажите о себе"></textarea>
    </div>

    <div class="form-group">
        <label>Контакты</label>
        <input type="text" id="profileContacts" placeholder="Телефон / Email">
    </div>

<button class="save-btn" id="saveProfile">Сохранить профиль</button>

</div>

        <h2 style="margin-top: 40px;">Мои работы</h2>

        <div class="gallery">
            <div class="card">
                <img src="images/photo1.jpg" alt="Абстрактно- композиционный натюрморт">
                <p>Абстрактно- композиционный натюрморт</p>
            </div>

            <div class="card">
                <img src="images/photo2.jpg" alt="Дизайн персонажа">
                <p>Дизайн персонажа</p>
            </div>
        </div>

    </div>
</main>

<footer class="footer">
    <div>© АртПин</div>
</footer>

<div class="modal" id="workModal">
    <div class="modal-content">
        <span class="modal-close" id="modalClose">×</span>
        <img id="modalImg">
        <p id="modalTitle"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
