<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АртПин – Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="container header__row">
        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="Логотип" style="width: 32px; height: 32px; object-fit: contain;">
            <div class="brand__text">
                <span class="brand__name">АртПин</span>
            </div>
        </a>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="collections.html">Подборки</a>
            <a href="profile.html">Профиль</a>
        </nav>
        <button class="theme-btn" id="themeBtn">🌙 Тема</button>
    </div>
</header>

<main>
    <div class="container">
        <div class="hero">
            <h1>Популярные работы</h1>
        </div>

        <div class="gallery">
            <div class="card">
                <img src="images/photo1.jpg" alt="Абстрактно- композиционный натюрморт">
                <p>Абстрактно- композиционный натюрморт</p>
            </div>
            <div class="card">
                <img src="images/photo2.jpg" alt="Дизайн персонажа">
                <p>Дизайн персонажа</p>
            </div>
            <div class="card">
                <img src="images/photo3.jpg" alt="Эстетика">
                <p>Эстетика</p>
            </div>
            <div class="card">
                <img src="images/photo4.jpg" alt="Композиция симметрия / асимметрия">
                <p>Композиция симметрия / асимметрия</p>
            </div>
            <div class="card">
                <img src="images/photo5.jpg" alt="Логотип из слова">
                <p>Логотип из слова</p>
            </div>
            <div class="card">
                <img src="images/photo6.jpg" alt="Мудборд ">
                <p>Мудборд </p>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div>© АртПин</div>
</footer>

<div class="modal" id="workModal">
    <div class="modal-content">
        <span class="modal-close" id="modalClose">×</span>
        <img id="modalImg">
        <p id="modalTitle"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
